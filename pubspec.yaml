name: leadloop
description: Offline-first customer enquiry capture for shop promoters.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  archive: ^4.0.9
  flutter:
    sdk: flutter
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.4.0
  connectivity_plus: ^6.1.4
  crypto: ^3.0.7
  firebase_auth: ^6.0.2
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_secure_storage: ^9.2.4
  share_plus: ^12.0.2
  hive_flutter: ^1.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# objective_c 9.6.x currently requires a newer native-assets API than the
# Flutter SDK used by the GitHub Pages build.
dependency_overrides:
  objective_c: 9.5.0

flutter:
  uses-material-design: true
  assets:
    - images/selvan_logo_transparent.png
    - images/selvan_logo_transparent_dark.png

